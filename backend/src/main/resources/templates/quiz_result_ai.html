<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - TeachQuest</title>
    <link rel="stylesheet" th:href="@{/quiz_premium.css}">
</head>

<body>

    <div class="page-header" style="max-width: 900px; margin: 20px auto; padding: 0 20px;">
        <div class="logo">TeachQuest</div>
        <a th:href="@{/quiz-hub}" class="btn btn-secondary" style="text-decoration: none;">Back to Quiz Hub</a>
    </div>

    <div class="quiz-container" style="max-width: 900px; margin: 0 auto; padding: 20px;">
        <div id="no-history"
            style="display: none; text-align: center; padding: 60px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <div style="font-size: 4rem; margin-bottom: 20px;">📊</div>
            <h2 style="color: #333;">No Results Yet</h2>
            <p style="color: #666; margin-bottom: 30px;">Complete a quiz from the Hub to see your AI-powered performance
                analysis here.</p>
            <a th:href="@{/quiz-hub}" class="btn btn-primary">Start a Quiz</a>
        </div>

        <div id="results-content" style="display: none;">
            <!-- Latest Result Prominent -->
            <div id="latest-result-section">
                <div class="card"
                    style="margin-bottom: 40px; border: 2px solid var(--primary-blue); position: relative; overflow: hidden;">
                    <div
                        style="position: absolute; top: 0; right: 0; background: var(--primary-blue); color: white; padding: 5px 20px; border-bottom-left-radius: 15px; font-weight: bold; font-size: 0.8rem;">
                        LATEST ATTEMPT</div>

                    <div class="result-summary" style="text-align: center; margin-bottom: 30px;">
                        <h2 id="latest-title" style="margin-bottom: 10px;">Quiz Complete! 🎉</h2>
                        <div id="latest-score" class="score-display">0%</div>
                        <p id="latest-status" style="color: #666; font-size: 1.1rem;"></p>
                    </div>

                    <div class="stats-grid" style="margin-bottom: 30px;">
                        <div class="stat-card">
                            <span id="latest-marks" class="stat-value">0/0</span>
                            <span style="font-size: 0.9rem; color: #777;">Questions</span>
                        </div>
                        <div class="stat-card">
                            <span id="latest-time" class="stat-value">0m</span>
                            <span style="font-size: 0.9rem; color: #777;">Time Taken</span>
                        </div>
                        <div id="latest-level-card" class="stat-card">
                            <span id="latest-level" class="stat-value">N/A</span>
                            <span style="font-size: 0.9rem; color: #777;">Accuracy</span>
                        </div>
                    </div>

                    <div class="ai-feedback-box"
                        style="background: #f0f7ff; border-left: 6px solid var(--primary-blue); padding: 25px; border-radius: 15px;">
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;">
                            <span style="font-size: 1.8rem;">🤖</span>
                            <h3 style="margin: 0; color: #1565C0;">AI Performance Analysis</h3>
                        </div>
                        <p id="latest-ai-feedback"
                            style="color: #333; line-height: 1.7; font-size: 1.05rem; margin: 0;"></p>
                    </div>
                </div>
            </div>

            <!-- History List -->
            <h2 style="margin-bottom: 20px; padding-left: 10px;">Attempt History</h2>
            <div id="history-container">
                <!-- History items injected here -->
            </div>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const userStr = sessionStorage.getItem('user');
            if (!userStr) {
                window.location.href = '/login';
                return;
            }
            const user = JSON.parse(userStr);
            const studentId = user.universityId || user.username || user.id;

            try {
                const response = await fetch(`/api/quizzes/history/${studentId}`);
                if (!response.ok) throw new Error("Failed to fetch history");

                const history = await response.json();
                const resultsContent = document.getElementById('results-content');
                const noHistory = document.getElementById('no-history');

                console.log("Loaded history for student:", studentId);
                console.log("Number of attempts:", history?.length || 0);
                console.log("History data:", history);

                if (!history || history.length === 0) {
                    noHistory.style.display = 'block';
                    resultsContent.style.display = 'none';
                    return;
                }

                noHistory.style.display = 'none';
                resultsContent.style.display = 'block';

                // Display Latest
                const latest = history[0];
                document.getElementById('latest-title').textContent = latest.quizTitle;
                document.getElementById('latest-score').textContent = latest.score + "%";

                const correctCount = Math.round((latest.score / 100) * latest.totalQuestions);
                document.getElementById('latest-marks').textContent = `${correctCount}/${latest.totalQuestions}`;

                const mins = Math.floor(latest.timeTakenSeconds / 60);
                const secs = latest.timeTakenSeconds % 60;
                document.getElementById('latest-time').textContent = mins + "m " + secs + "s";

                const level = latest.score >= 80 ? 'High' : (latest.score >= 50 ? 'Medium' : 'Low');
                const levelColor = latest.score >= 80 ? '#2e7d32' : (latest.score >= 50 ? '#f57c00' : '#d32f2f');
                const levelBg = latest.score >= 80 ? '#e8f5e9' : (latest.score >= 50 ? '#fff3e0' : '#ffebee');

                const levelEl = document.getElementById('latest-level');
                levelEl.textContent = level;
                levelEl.style.color = levelColor;
                document.getElementById('latest-level-card').style.background = levelBg;

                document.getElementById('latest-status').textContent = latest.score >= 80 ? "Outstanding! You've mastered this topic." : (latest.score >= 50 ? "Good progress. Keep pushing for perfection!" : "Keep practicing. Consistency is key.");
                document.getElementById('latest-ai-feedback').textContent = latest.aiFeedback || "AI is still processing your analysis, check back in a moment!";

                // Display ALL history (not just > 1)
                const historyContainer = document.getElementById('history-container');
                if (history.length > 1) {
                    historyContainer.innerHTML = history.slice(1).map(res => `
                        <div class="card" style="margin-bottom: 15px; padding: 20px; background: #fff; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee;">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <h4 style="margin: 0; color: #444;">${res.quizTitle}</h4>
                                    <span style="font-size: 0.75rem; background: #eee; padding: 2px 8px; border-radius: 10px; color: #666;">
                                        ${new Date(res.completedAt).toLocaleDateString()} ${new Date(res.completedAt).toLocaleTimeString()}
                                    </span>
                                </div>
                                <div style="font-size: 0.85rem; color: #888; margin-top: 5px;">
                                    Score: ${Math.round((res.score / 100) * res.totalQuestions)}/${res.totalQuestions} • Time: ${Math.floor(res.timeTakenSeconds / 60)}m ${res.timeTakenSeconds % 60}s
                                </div>
                            </div>
                            <div style="font-size: 1.3rem; font-weight: bold; color: ${res.score >= 80 ? '#2e7d32' : (res.score >= 50 ? '#f57c00' : '#d32f2f')}">
                                ${res.score}%
                            </div>
                        </div>
                    `).join('');
                } else {
                    historyContainer.innerHTML = '<p style="text-align:center; color:#999; font-style:italic;">No previous attempts yet.</p>';
                }

            } catch (err) {
                console.error("Error loading history:", err);
                document.getElementById('results-content').innerHTML = `<p style="color: red;">Error loading history: ${err.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>

</html>

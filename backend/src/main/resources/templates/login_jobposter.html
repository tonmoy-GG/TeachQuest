<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Poster Login - TeachQuest</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script>
        function showError(errorMessage) {
            alert(errorMessage);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        universityId: data.university_id,
                        password: data.password
                    })
                });

                if (response.ok) {
                    const user = await response.json();
                    if (user.userType === 'jobposter') {
                        sessionStorage.setItem('user', JSON.stringify(user));
                        window.location.href = '/view-applicants'; // Redirect to their posted jobs
                    } else {
                        showError("Incorrect role for this login page. This is for Job Posters.");
                    }
                } else {
                    const errorMsg = await response.text();
                    showError(errorMsg || "Login failed");
                }
            } catch (error) {
                console.error("Error:", error);
                showError("An error occurred. Please try again.");
            }
        }
    </script>
</head>

<body>
    <header class="branding-header">
        <div class="brand-logo">
            <h2>TeachQuest</h2>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h1>Hiring Portal</h1>
            <div class="role-icon">
                <span style="font-size: 64px;">💼</span>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="university_id">University ID:</label>
                    <input type="text" name="university_id" id="university_id" required><br><br>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required><br><br>
                </div>

                <button type="submit" class="btn-login" style="background-color: #27ae60;">Login</button>
            </form>

            <p class="register-link">Don't have an account? <a th:href="@{/register}">Register</a></p>
            <p class="back-to-selection">
                <a th:href="@{/}">Back to Selection</a>
            </p>
        </div>
    </div>
</body>

</html>

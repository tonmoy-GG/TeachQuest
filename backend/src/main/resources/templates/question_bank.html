<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - TeachQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/unified-theme.css}">
    <link rel="stylesheet" th:href="@{/teacher_dashboard.css}">
    <style>
        body {
            padding-top: 100px;
        }

        .bank-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: 20px;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            padding: 15px 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            background: white;
            padding: 20px;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }

        tr td:first-child {
            border-left: 1px solid #f1f5f9;
            border-radius: 12px 0 0 12px;
        }

        tr td:last-child {
            border-right: 1px solid #f1f5f9;
            border-radius: 0 12px 12px 0;
        }

        .tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tag-mcq {
            background: #e0f2fe;
            color: #0369a1;
        }

        .tag-case {
            background: #fdf2f8;
            color: #be185d;
        }

        .tag-short {
            background: #f0fdf4;
            color: #15803d;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: #f8fafc;
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .source-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #475569;
        }
    </style>
</head>

<body>
    <header id="main-header">
        <div class="brand">
            <h1>TeachQuest</h1>
        </div>
        <div class="user-controls">
            <div class="welcome-text" id="welcome-user">Hi, Teacher!!</div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="nav-container">
        <div class="nav-buttons" id="nav-buttons">
            <!-- Nav buttons injected by JS -->
        </div>
    </div>

    <div class="bank-container">
        <div class="bank-header">
            <div>
                <h1 style="font-family: 'Quantico'; color: #1e293b;">Teacher Question Bank</h1>
                <p style="color: #64748b;">Manage and organize your curated assessment materials.</p>
            </div>
            <div style="display: flex; gap: 15px;">
                <a th:href="@{/create-question-manual}" class="btn btn-primary"
                    style="display: flex; align-items: center; gap: 8px;">
                    <span>+</span> New Question
                </a>
                <a th:href="@{/create-casestudy-manual}" class="btn btn-secondary"
                    style="display: flex; align-items: center; gap: 8px;">
                    <span>🧩</span> New Case Study
                </a>
            </div>
        </div>

        <div class="card" style="padding: 0; background: transparent; box-shadow: none;">
            <table id="question-table">
                <thead>
                    <tr>
                        <th style="width: 45%;">Question Content</th>
                        <th>Type</th>
                        <th>Topic</th>
                        <th>Visibility</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="questions-tbody">
                    <!-- Questions loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <h2 style="margin-bottom: 20px; color: #1e293b;">Edit Question</h2>
            <form id="editForm">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">Question Text</label>
                    <textarea id="editQuestionText" rows="3" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit;"></textarea>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">Category</label>
                    <input type="text" id="editCategory" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">Correct Answer</label>
                    <input type="text" id="editCorrectAnswer" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-primary" onclick="saveEditQuestion()" style="flex: 1;">Save Changes</button>
                    <button type="button" class="btn btn-outline" onclick="closeEditModal()" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        let currentEditingId = null;
        let allQuestions = [];

        function renderNav(user) {
            const nav = document.getElementById('nav-buttons');
            const isTeacher = user.userType === 'teacher';
            const dashLink = isTeacher ? '/teacher-dashboard' : '/student-dashboard';

            let html = `<a href="${dashLink}" class="nav-btn">Dashboard</a>`;
            if (isTeacher) {
                html += `
                    <a href="/job-board" class="nav-btn">Job Board</a>
                    <a href="/view-applied-jobs" class="nav-btn">My Applications</a>
                    <a href="/study-resources" class="nav-btn">Study Resources</a>
                    <a href="/upload-resource" class="nav-btn">Upload Resources</a>
                    <a href="/question-bank" class="nav-btn active" style="background: #e0f2fe; color: #0369a1 !important;">Question Bank</a>
                `;
            }
            nav.innerHTML = html;
        }

        async function loadQuestions() {
            try {
                const response = await fetch('/api/quizzes/teacher-bank');
                if (response.ok) {
                    allQuestions = await response.json();
                    renderQuestionTable();
                } else {
                    console.error('Failed to load questions');
                }
            } catch (error) {
                console.error('Error loading questions:', error);
            }
        }

        function getTypeTag(qType) {
            if (!qType) return '<span class="tag tag-mcq">MCQ</span>';
            if (qType.includes('MCQ') || qType === 'MCQ') return '<span class="tag tag-mcq">MCQ</span>';
            if (qType.includes('CASE') || qType === 'CASE') return '<span class="tag tag-case">Case Study</span>';
            if (qType.includes('SHORT') || qType === 'SHORT' || qType === 'SA') return '<span class="tag tag-short">Short Ans</span>';
            return '<span class="tag tag-mcq">' + qType + '</span>';
        }

        function renderQuestionTable() {
            const tbody = document.getElementById('questions-tbody');
            tbody.innerHTML = '';

            if (allQuestions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px; color: #94a3b8;">No questions yet. Create your first question!</td></tr>';
                return;
            }

            allQuestions.forEach(q => {
                const truncatedText = q.question.substring(0, 60) + (q.question.length > 60 ? '...' : '');
                const row = `
                    <tr>
                        <td>
                            <div style="font-weight: 500; color: #1e293b;">${truncatedText}</div>
                            <small style="color: #94a3b8;">ID: ${q.id}</small>
                        </td>
                        <td>${getTypeTag(q.qCategory)}</td>
                        <td style="color: #475569;">${q.qCategory || 'General'}</td>
                        <td>
                            <span class="source-pill">👤 Private</span>
                        </td>
                        <td style="text-align: right;">
                            <button class="action-btn" onclick="openEditModal(${q.id})">Edit</button>
                            <button class="action-btn" onclick="deleteQuestion(${q.id})" style="color: #ef4444; border-color: #fee2e2;">Delete</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function openEditModal(questionId) {
            const question = allQuestions.find(q => q.id === questionId);
            if (!question) {
                alert('Question not found');
                return;
            }

            currentEditingId = questionId;
            document.getElementById('editQuestionText').value = question.question;
            document.getElementById('editCategory').value = question.qCategory || '';
            document.getElementById('editCorrectAnswer').value = question.qCorrectAnswer || '';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditingId = null;
        }

        async function saveEditQuestion() {
            if (!currentEditingId) return;

            const updatedData = {
                question: document.getElementById('editQuestionText').value,
                qCategory: document.getElementById('editCategory').value,
                qCorrectAnswer: document.getElementById('editCorrectAnswer').value
            };

            try {
                const response = await fetch(`/api/quizzes/question/${currentEditingId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    alert('Question updated successfully!');
                    closeEditModal();
                    loadQuestions();
                } else {
                    const error = await response.text();
                    alert('Error updating question: ' + error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating question');
            }
        }

        async function deleteQuestion(questionId) {
            if (!confirm('Are you sure you want to delete this question? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/quizzes/question/${questionId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Question deleted successfully!');
                    loadQuestions();
                } else {
                    const error = await response.text();
                    alert('Error deleting question: ' + error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting question');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userStr = sessionStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('welcome-user').textContent = "Hi, " + (user.name || user.username || "User") + "!!";
                renderNav(user);
                loadQuestions();
            } else {
                window.location.href = '/login';
            }
        });

        function logout() { sessionStorage.removeItem('user'); window.location.href = '/'; }

        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('editModal');
            if (e.target === modal) {
                closeEditModal();
            }
        });
    </script>
</body>

</html>

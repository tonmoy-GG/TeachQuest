<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study Creation - TeachQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/unified-theme.css}">
    <link rel="stylesheet" th:href="@{/teacher_create.css}">
    <style>
        body {
            padding-top: 100px;
        }

        .creator-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1e293b;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
        }

        .scenario-box {
            border: 2px dashed #cbd5e1;
            padding: 30px;
            border-radius: 15px;
            background: #f8fafc;
            margin-bottom: 30px;
        }

        .question-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 15px;
            position: relative;
        }

        .btn-add {
            background: #e0f2fe;
            color: #0369a1;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header id="main-header">
        <div class="brand">
            <h1>TeachQuest</h1>
        </div>
        <div class="user-controls">
            <div class="welcome-text" id="welcome-user">Hi, Teacher!!</div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="nav-container">
        <div class="nav-buttons" id="nav-buttons">
            <!-- Nav Injected -->
        </div>
    </div>

    <div class="creator-container">
        <a th:href="@{/question-bank}"
            style="text-decoration: none; color: var(--primary-blue); font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 25px;">
            ← Back to Question Bank
        </a>

        <div class="form-card">
            <div style="text-align: center; margin-bottom: 40px;">
                <h1 style="font-family: 'Quantico'; color: #1e293b;">🧩 Design Case Study</h1>
                <p style="color: #64748b;">Create complex, real-world scenarios for advanced assessment.</p>
            </div>

            <form>
                <div class="form-group">
                    <label>Case Study Header</label>
                    <input type="text" placeholder="e.g. Scalability Failure in E-commerce Cluster">
                </div>

                <div class="scenario-box">
                    <label>The Scenario Context</label>
                    <textarea rows="8"
                        placeholder="Detailed description of the scenario, environment, and the problem encountered..."></textarea>
                </div>

                <div style="margin-bottom: 30px;">
                    <h3 style="margin-bottom: 15px; color: #1e293b;">Associated Questions</h3>
                    <div id="questions-list">
                        <div class="question-item">
                            <label>Question 1</label>
                            <input type="text" placeholder="What is the primary architectural bottleneck described?">
                        </div>
                    </div>
                    <button type="button" class="btn-add">+ Add Scenario Question</button>
                </div>

                <div style="display: flex; gap: 15px;">
                    <button type="button" class="btn btn-primary" style="flex: 2; padding: 15px;"
                        onclick="window.location.href='/question-bank'">🚀 Save & Publish Case Study</button>
                    <button type="button" class="btn btn-outline" style="flex: 1;"
                        onclick="window.location.href='/question-bank'">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = sessionStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('welcome-user').textContent = "Hi, " + (user.name || user.username || "User") + "!!";
                const nav = document.getElementById('nav-buttons');
                nav.innerHTML = `
                    <a href="/teacher-dashboard" class="nav-btn">Dashboard</a>
                    <a href="/question-bank" class="nav-btn active">Question Bank</a>
                    <a href="/study-resources" class="nav-btn">Study Resources</a>
                `;
            } else window.location.href = '/login';
        });

        function logout() { sessionStorage.removeItem('user'); window.location.href = '/'; }
    </script>
</body>

</html>

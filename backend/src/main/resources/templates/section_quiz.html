<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section Quiz - TeachQuest</title>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/unified-theme.css}">
    <link rel="stylesheet" th:href="@{/quiz_premium.css}">
    <style>
        body {
            padding-top: 100px;
        }

        .quiz-container {
            margin-top: 20px;
        }

        .tab-btn {
            padding: 12px 25px;
            font-weight: bold;
            border: none;
            background: #f0f0f0;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-blue);
            color: white;
        }

        .section-tabs {
            border-bottom: 2px solid #eee;
            margin-bottom: 30px;
        }

        .back-btn-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .back-btn-header:hover {
            transform: translateX(-5px);
        }
    </style>
</head>

<body>
    <header id="main-header">
        <div class="brand">
            <h1>TeachQuest</h1>
        </div>
        <div class="user-controls">
            <div class="welcome-text" id="welcome-user">Hi, Student!!</div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="nav-container">
        <div class="nav-buttons" id="nav-buttons">
            <!-- Navigation Injected here -->
        </div>
    </div>

    <div class="quiz-container">
        <a href="/quiz-hub" class="back-btn-header">← Back to Hub</a>

        <div class="card">
            <!-- Sections Tabs -->
            <div class="section-tabs">
                <button class="tab-btn active" onclick="activateTab(this, 'mcq')">MCQ</button>
                <button class="tab-btn" onclick="activateTab(this, 'tf')">True/False</button>
                <button class="tab-btn" onclick="activateTab(this, 'short')">Short Answer</button>
            </div>

            <div style="margin-bottom: 25px;">
                <h2 id="section-title">Section: Multiple Choice</h2>
                <p id="section-desc" style="color: #666;">Choose the correct answer for the following questions.</p>
            </div>

            <!-- Question Text -->
            <div class="question-text" id="question-text"
                style="font-size: 1.3rem; margin-bottom: 25px; line-height: 1.4;">
                Loading questions...
            </div>

            <!-- Options Output -->
            <div class="options-grid" id="options-grid">
                <!-- Options injected here -->
            </div>

            <!-- Navigation Buttons -->
            <div style="margin-top: 40px; display: flex; justify-content: space-between; align-items: center;">
                <button class="btn btn-secondary" onclick="prevQuestion()" id="prev-btn">Previous</button>
                <div id="q-counter" style="color: #888; font-weight: bold;">Question 1/0</div>
                <button class="btn btn-primary" onclick="nextQuestion()" id="next-btn">Next Question ➜</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let questions = [];
        let currentIndex = 0;
        let activeType = 'MCQ';

        async function loadSection(type) {
            activeType = type;
            currentIndex = 0;

            const titles = { 'MCQ': 'Multiple Choice', 'TF': 'True/False', 'SHORT': 'Short Answer' };
            const desc = {
                'MCQ': 'Choose the correct answer.',
                'TF': 'Decide if the statement is True or False.',
                'SHORT': 'Type the correct conceptual explanation.'
            };

            document.getElementById('section-title').textContent = `Section: ${titles[type]}`;
            document.getElementById('section-desc').textContent = desc[type];
            document.getElementById('question-text').textContent = "🔍 Fetching questions from database...";
            document.getElementById('options-grid').innerHTML = "";

            try {
                const response = await fetch(`/api/quizzes/by-type?type=${type}`);
                if (response.ok) {
                    questions = await response.json();
                    if (questions.length > 0) {
                        renderQuestion();
                    } else {
                        document.getElementById('question-text').textContent = "📭 No questions found in this section yet.";
                        document.getElementById('q-counter').textContent = "0/0";
                    }
                }
            } catch (e) { console.error(e); }
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            document.getElementById('question-text').textContent = q.question;
            const container = document.getElementById('options-grid');
            container.innerHTML = '';

            document.getElementById('q-counter').textContent = `Question ${currentIndex + 1}/${questions.length}`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;

            if (activeType === 'SHORT') {
                container.innerHTML = `
                    <textarea id="shortAnswerInput" class="short-answer-area" rows="4" placeholder="Your explanation..." style="width:100%"></textarea>
                    <button class="btn btn-secondary" style="margin-top:15px;" onclick="checkAI()">✨ Verify with AI</button>
                    <div id="ai-feedback-box" class="card" style="display:none; margin-top:15px; background:#f0f7ff; border-left:5px solid var(--primary-blue);">
                        <b>🤖 AI Feedback:</b>
                        <p id="ai-feedback-text" style="margin-top:10px;"></p>
                    </div>
                `;
            } else {
                const options = q.options || [];
                options.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'option-card';
                    div.style.textAlign = 'left';
                    div.onclick = function () {
                        document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
                        this.classList.add('selected');
                    };
                    div.innerHTML = `
                        <div class="option-marker">${opt.optionLabel}</div>
                        <div>${opt.optionText}</div>
                    `;
                    container.appendChild(div);
                });
            }
        }

        async function checkAI() {
            const userTxt = document.getElementById('shortAnswerInput').value;
            const currentQ = questions[currentIndex];
            const feedbackBox = document.getElementById('ai-feedback-box');
            const feedbackTxt = document.getElementById('ai-feedback-text');

            if (!userTxt) return alert("Type something first!");
            feedbackTxt.textContent = "AI is thinking...";
            feedbackBox.style.display = 'block';

            try {
                const res = await fetch('/api/quizzes/evaluate-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: currentQ.question,
                        userAnswer: userTxt,
                        correctAnswer: currentQ.qCorrectAnswer
                    })
                });
                const result = await res.json();
                feedbackTxt.innerHTML = `<b>Score: ${result.score}%</b><br>${result.feedback}`;
            } catch (e) { feedbackTxt.textContent = "Error connecting to AI."; }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                alert("Section Completed! Your score has been recorded.");
                saveSectionResult();
            }
        }

        async function saveSectionResult() {
            const userStr = sessionStorage.getItem('user');
            if (!userStr) return;
            const user = JSON.parse(userStr);

            // Calculate actual score based on answers
            let correctCount = 0;
            questions.forEach((q, index) => {
                const selectedCard = document.querySelectorAll('.option-card.selected')[index];
                if (selectedCard) {
                    const selectedLabel = selectedCard.querySelector('.option-marker').textContent;
                    if (selectedLabel === q.qCorrectAnswer) {
                        correctCount++;
                    }
                }
            });

            const scorePercentage = Math.round((correctCount / questions.length) * 100);

            const payload = {
                studentId: user.universityId || user.username || user.id,
                studentName: user.name || user.username,
                quizTitle: "Section Practice: " + activeType,
                score: scorePercentage,
                totalQuestions: questions.length,
                timeTakenSeconds: 0
            };

            try {
                await fetch('/api/quizzes/save-result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert(`Section Completed! Your score: ${scorePercentage}%`);
                window.location.href = '/quiz-results';
            } catch (err) {
                console.error(err);
                alert(`Section Completed! Your score: ${scorePercentage}%`);
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function activateTab(btn, type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const map = { 'mcq': 'MCQ', 'tf': 'TF', 'short': 'SHORT' };
            loadSection(map[type]);
        }

        function logout() { sessionStorage.removeItem('user'); window.location.href = '/'; }

        // Load Nav and Initial Section
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = sessionStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('welcome-user').textContent = "Hi, " + (user.name || user.username || "User") + "!!";

                // Render Nav
                const nav = document.getElementById('nav-buttons');
                const dashLink = user.userType === 'teacher' ? '/teacher-dashboard' : '/student-dashboard';
                nav.innerHTML = `
                    <a href="${dashLink}" class="nav-btn">Dashboard</a>
                    <a href="/quiz-hub" class="nav-btn active">Quiz Hub</a>
                    <a href="/study-resources" class="nav-btn">Study Resources</a>
                `;
            } else { window.location.href = '/login'; }

            loadSection('MCQ');
        });
    </script>
</body>

</html>
